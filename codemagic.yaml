workflows:
  ios-app-store:
    name: Edukamba iOS — App Store
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: App Store Connect API

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.edukamba.app
      vars:
        BUNDLE_ID: com.edukamba.app
        XCODE_WORKSPACE: ios/App/App.xcworkspace
        XCODE_SCHEME: App
        VITE_SUPABASE_URL: $VITE_SUPABASE_URL
        VITE_SUPABASE_ANON_KEY: $VITE_SUPABASE_ANON_KEY
      node: 20.x

    scripts:
      - name: Install npm dependencies
        script: npm ci

      - name: Build web app
        script: npm run build

      - name: Sync Capacitor iOS
        script: npx cap sync ios

      - name: Install CocoaPods
        script: |
          cd ios/App
          pod install --repo-update

      - name: Set up code signing
        script: xcode-project use-profiles

      - name: Set Xcode automatic signing OFF (use manual)
        script: |
          sed -i '' 's/DEVELOPMENT_TEAM = "";/DEVELOPMENT_TEAM = "C47548 65RX";/g' ios/App/App.xcodeproj/project.pbxproj || true
          plutil -replace ITSAppUsesNonExemptEncryption -bool NO ios/App/App/Info.plist || true

      - name: Build iOS IPA
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            --config Release

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - paulo@edukamba.com
        notify:
          success: true
          failure: true
